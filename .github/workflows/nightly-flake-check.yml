name: Nightly flake check

# Runs the unit and integration suites five times over. A suite that passes on
# PR twice can still be flaky at a lower rate; this is what surfaces that,
# without paying for five runs on every push.
#
# Deliberately separate from the nightly e2e suite, which is not wired yet (no
# real Argent flows exist: e2e/flows holds only a placeholder). When it is,
# it belongs in its own workflow so an e2e failure never masks a unit flake.
on:
  schedule:
    # 02:00 UTC. Cron here is always UTC, never local time.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  flake-check:
    name: ${{ matrix.suite }} (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      # Every combination must run: the whole point is counting how many of the
      # five passed, which is impossible if a failure cancels the rest.
      fail-fast: false
      matrix:
        suite: [unit, integration]
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run ${{ matrix.suite }} suite
        id: run
        run: |
          # pipefail so `| tee` does not mask a failure: otherwise every
          # nightly run would pass and the flake check would prove nothing.
          set -o pipefail
          if [ "${{ matrix.suite }}" = "unit" ]; then
            bun run test 2>&1 | tee result.log
          else
            bun run test:integration 2>&1 | tee result.log
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.suite }}-run-${{ matrix.run }}
          path: result.log
          retention-days: 30

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: flake-check
    if: always()
    steps:
      - name: Summarise and file an issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.flake-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "### Nightly flake check"
            echo ""
            echo "Unit and integration suites, 5 runs each."
            echo ""
            echo "- **Result:** ${RESULT}"
            echo "- **Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RESULT" = "success" ]; then
            echo "All 10 runs passed."
            exit 0
          fi

          # A partial failure across identical runs is the signature of a flake:
          # same commit, same inputs, different outcome.
          title="Nightly flake check failed ($(date -u +%Y-%m-%d))"

          # Reuse a single open issue rather than filing one per night.
          existing=$(gh issue list --repo "$REPO" --state open \
            --label flaky-test --json number --jq '.[0].number' || true)

          body="The nightly flake check did not pass cleanly.

          Suites run 5x each on the same commit. Inconsistent results across those
          runs indicate a flaky test rather than a genuine regression.

          - **Run:** ${RUN_URL}
          - **Commit:** \`${GITHUB_SHA}\`
          - **Result:** ${RESULT}

          Per-run logs are attached to the run as artifacts (\`nightly-<suite>-run-<n>\`).
          Compare a passing and a failing run to identify the non-deterministic test.

          Common causes, per \`.claude/rules/test-writing.md\`: real clocks, ambient
          timezone or locale, shared mutable state, assumed iteration order, or
          generated ids inside an asserted shape."

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #${existing}"
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" \
              --label flaky-test || \
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
