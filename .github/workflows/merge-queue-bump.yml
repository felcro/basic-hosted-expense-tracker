name: Bump PR in merge queue

# GitHub's merge queue has NO priority feature. Entries are ordered strictly by
# the time they were added, and there is no API to reorder them.
#
# So this is a workaround, not a setting: to move PR #N to the front, every
# entry ahead of it is removed from the queue and then re-added behind it. They
# keep their place relative to each other, they just lose it relative to #N.
#
# Cost: each dequeued PR abandons its in-flight merge-queue CI run and starts a
# fresh one when re-added. Use it when something genuinely needs to jump, not
# as routine traffic management.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to move to the front of the queue.'
        required: true
      reason:
        description: 'Why this PR is being prioritised (recorded on the PR).'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bump:
    name: Move PR to front of queue
    runs-on: ubuntu-latest
    steps:
      - name: Reorder the queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.pr }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          # The merge queue is only exposed through GraphQL; there is no REST
          # equivalent for reading queue entries in order.
          queue=$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                mergeQueue {
                  entries(first: 50) {
                    nodes {
                      position
                      pullRequest { number title }
                    }
                  }
                }
              }
            }' -F owner="${REPO%/*}" -F name="${REPO#*/}")

          echo "$queue" | jq -r '
            .data.repository.mergeQueue.entries.nodes[]
            | "position \(.position): #\(.pullRequest.number) \(.pullRequest.title)"'

          target_pos=$(echo "$queue" | jq -r --arg t "$TARGET" '
            .data.repository.mergeQueue.entries.nodes[]
            | select(.pullRequest.number == ($t | tonumber)) | .position')

          if [ -z "$target_pos" ] || [ "$target_pos" = "null" ]; then
            echo "::error::PR #${TARGET} is not currently in the merge queue."
            exit 1
          fi

          if [ "$target_pos" = "1" ]; then
            echo "PR #${TARGET} is already at the front of the queue."
            exit 0
          fi

          # Everything strictly ahead of the target.
          ahead=$(echo "$queue" | jq -r --argjson p "$target_pos" '
            .data.repository.mergeQueue.entries.nodes[]
            | select(.position < $p) | .pullRequest.number')

          echo "PRs ahead of #${TARGET}: ${ahead:-none}"

          # Remove ahead-of-target entries, front to back.
          for pr in $ahead; do
            echo "Dequeuing #${pr}..."
            gh pr merge "$pr" --disable-auto --repo "$REPO" || \
              echo "::warning::Could not dequeue #${pr}; continuing."
          done

          # Re-queue the target first so it takes the front position.
          echo "Queuing #${TARGET} at the front..."
          gh pr merge "$TARGET" --squash --auto --repo "$REPO"

          # Then restore the others behind it, preserving their prior order.
          for pr in $ahead; do
            echo "Re-queuing #${pr}..."
            gh pr merge "$pr" --squash --auto --repo "$REPO" || \
              echo "::warning::Could not re-queue #${pr}. Re-add it manually."
          done

          gh pr comment "$TARGET" --repo "$REPO" --body \
            "Moved to the front of the merge queue by @${GITHUB_ACTOR}.

          **Reason:** ${REASON}

          Dequeued and re-added behind it: ${ahead:-none}"

          {
            echo "### Merge queue reordered"
            echo ""
            echo "- **Prioritised:** #${TARGET}"
            echo "- **Reason:** ${REASON}"
            echo "- **Moved behind it:** ${ahead:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
